name: APK

# Every run builds both faces from the same code: classic (calorie-diary) and pixel (pixel-diary).
# main    -> release "v<version>.<run>",          calorie-diary-<version>.<run>.apk + pixel-diary-<version>.<run>.apk
# develop -> pre-release "dev-<version>.<run>",   the same files with a dev- prefix
# Dev and release builds share package and key, so a dev build installs over a release build and back;
# classic and pixel have different packages and sit on the phone side by side.
on:
  push:
    branches: [main, develop]
  # a PR into develop or main builds both APKs as run artifacts to try before merging, no release
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets come from the environment named after the branch (develop, main; for a PR its target), then from repository secrets
    environment: ${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Version
        run: |
          BASE=$(grep -oP "'VERSION_NAME', '\K[^']+" build.gradle)
          VERSION="$BASE.${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "main" ]; then PREFIX=""; TAG="v$VERSION"; else PREFIX="dev-"; TAG="dev-$VERSION"; fi
          {
            echo "VERSION_CODE=$((100 + ${{ github.run_number }}))"
            echo "VERSION_NAME=$PREFIX$VERSION"
            echo "APK_CLASSIC=${PREFIX}calorie-diary-$VERSION.apk"
            echo "APK_PET=${PREFIX}pixel-diary-$VERSION.apk"
            echo "TAG=$TAG"
            echo "PRERELEASE=$([ -n "$PREFIX" ] && echo --prerelease || true)"
          } >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set, the APK will be unsigned"
          fi
      - name: Build
        env:
          ODIROUTER_API_KEY: ${{ secrets.ODIROUTER_API_KEY }}
          ODIROUTER_MODEL: ${{ vars.ODIROUTER_MODEL }}
          ODIROUTER_BASE: ${{ vars.ODIROUTER_BASE }}
          ODIROUTER_AUDIO_MODEL: ${{ vars.ODIROUTER_AUDIO_MODEL }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$ODIROUTER_API_KEY" ]; then echo "::warning::ODIROUTER_API_KEY is not set, the key will have to be entered in the app"; fi
          gradle assembleClassicRelease assemblePetRelease --no-daemon --stacktrace
          mkdir -p dist
          cp "$(ls build/outputs/apk/classic/release/*.apk | head -1)" "dist/$APK_CLASSIC"
          cp "$(ls build/outputs/apk/pet/release/*.apk | head -1)" "dist/$APK_PET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_CLASSIC }}
          path: dist/${{ env.APK_CLASSIC }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PET }}
          path: dist/${{ env.APK_PET }}
          if-no-files-found: error
      - name: Release
        if: env.SIGNING_KEYSTORE != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "dist/$APK_CLASSIC" "dist/$APK_PET" --target "$GITHUB_SHA" --title "$VERSION_NAME" $PRERELEASE --notes "Сборка из ${{ github.ref_name }}, коммит ${GITHUB_SHA::7}."
