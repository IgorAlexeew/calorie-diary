name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set, the APK will be unsigned"
          fi
      - name: Build
        env:
          ODIROUTER_API_KEY: ${{ secrets.ODIROUTER_API_KEY }}
          ODIROUTER_MODEL: ${{ vars.ODIROUTER_MODEL }}
          ODIROUTER_BASE: ${{ vars.ODIROUTER_BASE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$ODIROUTER_API_KEY" ]; then echo "::warning::ODIROUTER_API_KEY is not set, the key will have to be entered in the app"; fi
          gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: calorie-diary
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
