plugins {
    id 'com.android.application' version '8.5.2'
}

// Build-time settings: environment variables win, then secrets.properties (not in git), then defaults.
def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) secretsFile.withReader('UTF-8') { secrets.load(it) }
def conf = { String name, String dflt -> System.getenv(name) ?: secrets.getProperty(name) ?: dflt }
def quoted = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'app.caloriediary'
    compileSdk 34

    defaultConfig {
        applicationId 'app.caloriediary'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'API_KEY', quoted(conf('ODIROUTER_API_KEY', ''))
        buildConfigField 'String', 'MODEL', quoted(conf('ODIROUTER_MODEL', 'free-vclaude-haiku-4.5'))
        buildConfigField 'String', 'API_BASE', quoted(conf('ODIROUTER_BASE', 'https://api.odirouter.ai/v1'))
    }

    buildFeatures { buildConfig true }

    // flat layout shared with build.sh
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    def keystore = file(conf('SIGNING_KEYSTORE', 'signing/release.p12'))
    signingConfigs {
        release {
            if (keystore.exists()) {
                storeFile keystore
                storeType 'pkcs12'
                storePassword conf('SIGNING_PASSWORD', '')
                keyAlias 'diary'
                keyPassword conf('SIGNING_PASSWORD', '')
                enableV1Signing false
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { checkReleaseBuilds false }
}
